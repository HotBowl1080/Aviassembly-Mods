<style>#aviassembly-wing-preview .wing-controls{padding-right:90px}#aviassembly-wing-preview .wing-stage{position:relative;width:100%;height:440px;touch-action:none}#aviassembly-wing-preview canvas{display:block;width:100%;height:100%;touch-action:none}#aviassembly-wing-preview img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}#aviassembly-wing-preview [data-status]{color:var(--muted-foreground)}@media(max-width:480px){#aviassembly-wing-preview .wing-stage{height:350px}}</style>
<script type="module">
const root=document.getElementById('aviassembly-wing-preview');
const payload=JSON.parse(root.querySelector('[data-model]').textContent);
const fallback=root.querySelector('[data-fallback]');fallback.src='data:image/png;base64,'+payload.fallback;
const status=root.querySelector('[data-status]'),canvas=root.querySelector('[data-canvas]'),stage=root.querySelector('.wing-stage'),view=root.querySelector('[data-view]'),xray=root.querySelector('[data-xray]'),buttons=[...root.querySelectorAll('[data-angle]')];
function bytes(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function inflate(s){const stream=new Blob([bytes(s)]).stream().pipeThrough(new DecompressionStream('deflate'));return new Response(stream).arrayBuffer()}
try{
const [THREE,orbit,pBytes,nBytes]=await Promise.all([import('https://esm.sh/three@0.169.0'),import('https://esm.sh/three@0.169.0/examples/jsm/controls/OrbitControls.js'),inflate(payload.p),inflate(payload.nrm)]);
const qp=new Int16Array(pBytes),qn=new Int8Array(nBytes),count=payload.n,stride=count*3;
for(let f=1;f<payload.frames;f++)for(let j=0;j<stride;j++){const i=f*stride+j;qp[i]+=qp[i-stride];qn[i]+=qn[i-stride]}
const tb=bytes(payload.t),tri=new Uint16Array(tb.buffer),tags=bytes(payload.tag),positions=new Float32Array(stride),normals=new Float32Array(stride);
const pa=new THREE.BufferAttribute(positions,3),na=new THREE.BufferAttribute(normals,3);pa.setUsage(THREE.DynamicDrawUsage);na.setUsage(THREE.DynamicDrawUsage);
const renderer=new THREE.WebGLRenderer({canvas,alpha:true,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0,0);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(42,1,.005,120),controls=new orbit.OrbitControls(camera,canvas);controls.enableDamping=true;controls.minDistance=.08;controls.maxDistance=30;
scene.add(new THREE.AmbientLight(0xffffff,1.3));const key=new THREE.DirectionalLight(0xffffff,2.4);key.position.set(4,7,3);scene.add(key);const fill=new THREE.DirectionalLight(0xffffff,1.1);fill.position.set(-4,1,-5);scene.add(fill);
const groupFor=t=>t===255?0:t===18?5:t<10?1:t<13?2:t<15?3:4,indices=Array.from({length:6},()=>[]);
for(let j=0;j<tri.length;j+=3)indices[groupFor(tags[tri[j]])].push(tri[j],tri[j+1],tri[j+2]);
const meshes=indices.map((index,category)=>{const g=new THREE.BufferGeometry();g.setAttribute('position',pa);g.setAttribute('normal',na);g.setIndex(index);g.boundingSphere=new THREE.Sphere(new THREE.Vector3(),15);const material=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.82,metalness:0,side:THREE.DoubleSide});const mesh=new THREE.Mesh(g,material);scene.add(mesh);return mesh});
function theme(){const c=document.createElement('canvas');c.width=c.height=1;const ctx=c.getContext('2d');ctx.fillStyle=getComputedStyle(root).color;ctx.fillRect(0,0,1,1);const rgb=ctx.getImageData(0,0,1,1).data;meshes.forEach(m=>m.material.color.setRGB(rgb[0]/255,rgb[1]/255,rgb[2]/255,THREE.SRGBColorSpace).lerp(new THREE.Color(.65,.65,.65),.6))}theme();new MutationObserver(theme).observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
let angle=30,target=30,lastAngle=-1,lastTime=performance.now();const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function updateModel(){const a=Math.floor(angle),b=Math.min(30,a+1),t=angle-a;for(let j=0;j<stride;j++){positions[j]=(qp[a*stride+j]*(1-t)+qp[b*stride+j]*t)/5000;normals[j]=(qn[a*stride+j]*(1-t)+qn[b*stride+j]*t)/127}for(let j=0;j<stride;j+=3){const length=Math.hypot(normals[j],normals[j+1],normals[j+2])||1;normals[j]/=length;normals[j+1]/=length;normals[j+2]/=length}pa.needsUpdate=true;na.needsUpdate=true;lastAngle=angle}
function appearance(){meshes.forEach((m,c)=>{const focused=view.value==='le'?c===3:view.value==='slats'?c===2:view.value==='flaps'?c===1:view.value==='aileron'?c===5:c!==0;const ghost=xray.checked&&!focused;m.material.transparent=ghost;m.material.opacity=ghost?.12:1;m.material.depthWrite=!ghost;m.renderOrder=ghost?0:1})}
function focus(){const wanted=view.value==='le'?3:view.value==='slats'?2:view.value==='flaps'?1:view.value==='aileron'?5:null;const box=new THREE.Box3();for(let j=0;j<count;j++)if(wanted===null||groupFor(tags[j])===wanted)box.expandByPoint(new THREE.Vector3(positions[j*3],positions[j*3+1],positions[j*3+2]));const sphere=box.getBoundingSphere(new THREE.Sphere()),radius=Math.max(.12,sphere.radius);controls.target.copy(sphere.center);const direction=view.value==='le'?new THREE.Vector3(1.1,-.75,.75):new THREE.Vector3(1.2,.9,1.5);camera.position.copy(sphere.center).addScaledVector(direction.normalize(),radius/Math.sin(camera.fov*Math.PI/360)*1.18);camera.lookAt(sphere.center);controls.update()}
function label(){status.textContent='v0.16 · '+target+'° · Slats '+(target>=20?'extended':'retracted')+' · LE flaps '+(target===30?'extended':'retracted')}
buttons.forEach(button=>button.addEventListener('click',()=>{target=Number(button.dataset.angle);buttons.forEach(b=>b.setAttribute('aria-pressed',String(b===button)));label()}));view.addEventListener('change',()=>{xray.checked=view.value!=='wing';appearance();focus()});xray.addEventListener('change',appearance);
new ResizeObserver(()=>{const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}).observe(stage);updateModel();appearance();focus();label();fallback.hidden=true;
renderer.setAnimationLoop(now=>{const dt=Math.min(.05,(now-lastTime)/1000);lastTime=now;if(reduced.matches)angle=target;else angle+=Math.sign(target-angle)*Math.min(Math.abs(target-angle),45*dt);if(Math.abs(angle-lastAngle)>.00001)updateModel();controls.update();renderer.render(scene,camera)});root.dataset.ready='true';
}catch(error){status.textContent='Static mesh preview · interactive rendering unavailable in this browser';buttons.forEach(b=>b.disabled=true);view.disabled=true;xray.disabled=true;console.error(error)}
</script></body></html>
