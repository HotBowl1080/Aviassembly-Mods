if(!radians)return;
for(let i=0;i<count;i++){const tag=tags[i];if(tag!==13&&tag!==14)continue;

lePosition.fromArray(positions,j).sub(hinge.pivot).applyAxisAngle(hinge.axis,radians).add(hinge.pivot).toArray(positions,j);
